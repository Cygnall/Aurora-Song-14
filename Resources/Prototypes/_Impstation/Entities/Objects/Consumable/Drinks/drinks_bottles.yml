
- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottlePlasticSmallBaseFull]
  id: DrinkFoodColoringBottleFull
  abstract: true
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Drinks/Plastic/foodcoloringbottle.rsi
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
    inHandsMaxFillLevels: 0
    inHandsFillBaseName: null
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 15
  - type: PhysicalComposition
    materialComposition:
      Plastic: 15
  - type: Item
    size: Tiny

- type: entity
  parent: DrinkFoodColoringBottleFull
  id: DrinkRedFoodColoringBottleFull
  name: red food coloring bottle
  components:
  - type: Sprite
    color: "#720000"
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: RedFoodColoring
          Quantity: 15

