- type: entity
  parent: DeathRattleImplant
  id: DeathRattleImplantColcomm
  name: colcomm death rattle implant
  description: This implant will inform the Colcomm radio channel should the user fall into critical condition or die.
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel:
    - ColCom

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantSLE
  name: SLE radio implant
  description: This implant grants access to the SLE channel without a headset.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
  - type: RadioImplant
    radioChannels:
    - Sle

- type: entity
  parent: BaseSubdermalImplant
  id: TriageTrackingImplant
  name: triage tracking implant
  description: This implant has a tracking device monitor for the Triage and Medical radio channels.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
#    - type: SuitSensor
#      randomMode: false
#      controlsLocked: true
#      mode: SensorCords
#      activationContainer: "implant"
#    - type: DeviceNetwork
#      deviceNetId: Wireless
#      transmitFrequencyId: SuitSensor
#    - type: StationLimitedNetwork
#    - type: WirelessNetworkConnection
#      range: 500
    - type: TriggerOnMobstateChange
      mobState:
      - Critical
      - Dead
    - type: RattleOnTrigger
      radioChannel:
      - Medical
      - Triage

- type: entity
  parent: BaseSubdermalImplant
  id: PrisonTrackingImplant
  name: prison tracking implant
  description: This implant has a condition monitor for the SLE radio channel, for tracking prisoners.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      whitelist:
        components:
        - MobState # admeme implanting a chair with tracking implant needs to give the chair mobstate so it can die first
    - type: SuitSensor
      randomMode: false
      controlsLocked: true
      mode: SensorCords
      activationContainer: "implant"
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: SuitSensor
    - type: StationLimitedNetwork
    - type: WirelessNetworkConnection
      range: 500
    - type: TriggerOnMobstateChange
      mobState:
      - Critical
      - Dead
    - type: RattleOnTrigger
      radioChannel:
      - Sle
