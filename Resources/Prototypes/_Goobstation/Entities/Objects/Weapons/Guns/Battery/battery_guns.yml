- type: entity
  name: EG-4 energy revolver
  parent: [ BaseWeaponBatterySmall]
  id: WeaponEnergyRevolver
  description: A highly advanced energy revolver capable of firing both lethal and disabling bullets.
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/erevolver.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mode-disabler
      shader: unshaded
      map: [ "Firemode" ]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
    - suitStorage
    - Back
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/erevolver.rsi
  - type: Gun
    fireRate: 2.5
    projectileSpeed: 37.50
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 1005
    startingCharge: 1005
  - type: BatteryAmmoProvider
    proto: BulletEnergyGunMagnum
    fireCost: 100
  - type: BatteryWeaponFireModes # Aurora's Song - Firemode Refactor
    fireModes:
    - proto: BulletEnergyGunMagnum
      fireCost: 100
      #name: lethal # Aurora's Song - Firemode Refactor
      #state: lethal # Aurora's Song - Firemode Refactor
    - proto: NFBulletDisabler
      fireCost: 50
      #name: disabling # Aurora's Song - Firemode Refactor
      #state: disabler # Aurora's Song - Firemode Refactor
      pacifismAllowedMode: true # Aurora's Song
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryWeaponFireModeVisuals.State: # Aurora's Song - Firemode Refactor
        Firemode:
          BulletEnergyGunMagnum: { state: mode-lethal } # Aurora's Song - Firemode Refactor
          NFBulletDisabler: { state: mode-disabler } # Aurora's Song - Firemode Refactor
  - type: Tag
    tags:
    - Sidearm
  - type: BatterySelfRecharger # 20 seconds to fully recharge, but it does not do so if it has been fired in the last 5 seconds.
    autoRechargeRate: 50
    autoRechargePauseTime: 5

