- type: inventoryTemplate
  id: ipc
  slots:
    - name: shoes
      slotTexture: shoes
      slotFlags: FEET
      stripTime: 3
      uiWindowPos: 1,0
      strippingWindowPos: 1,3
      displayName: Shoes
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 6
      uiWindowPos: 0,1
      strippingWindowPos: 0,2
      displayName: Jumpsuit
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 6
      uiWindowPos: 1,1
      strippingWindowPos: 1,2
      displayName: Suit
      # Underwear
    # - name: undershirt
    #   slotTexture: undershirt
    #   slotFlags: UNDERSHIRT
    #   stripTime: 8
    #   uiWindowPos: 4,1
    #   strippingWindowPos: 3,1
    #   displayName: Undershirt
    # - name: underpants
    #   slotTexture: underpants
    #   slotFlags: UNDERPANTS
    #   stripTime: 12
    #   uiWindowPos: 4,0
    #   strippingWindowPos: 3,2
    #   displayName: Underpants
    # - name: socks
    #   slotTexture: socks
    #   slotFlags: SOCKS
    #   stripTime: 8
    #   uiWindowPos: 4,2
    #   strippingWindowPos: 3,3
    #   displayName: Socks
    - name: gloves
      slotTexture: gloves
      slotFlags: GLOVES
      uiWindowPos: 2,1
      strippingWindowPos: 2,2 # Aurora's Song - Changed to be the same as other species
      displayName: Gloves
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 0,2
      strippingWindowPos: 0,1
      displayName: Neck
    - name: mask
      uiWindowPos: 1,2
      slotTexture: mask
      slotFlags: MASK
      strippingWindowPos: 1,1
      displayName: Mask
      whitelist:
        components:
        - IdentityBlocker
        tags:
        - IPCMaskWearable
        # Start TheDen - Allow IPCs to smoke
        - Cigarette
        - Cigar
        # End TheDen
    - name: neck2 # Aurora's Song - Second neck slot (slotflags edition)
      slotTexture: neck
      slotFlags: NECK2 # Aurora's Song - Second neck slot (slotflags edition)
      uiWindowPos: 2,2
      strippingWindowPos: 2,1
      displayName: Neck 2
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 0,3 # Aurora's Song - Move to actual eye position
      strippingWindowPos: 0,0
      displayName: Eyes
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,3
      strippingWindowPos: 1,0
      displayName: Head
    - name: pocket1
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,4
      dependsOn: jumpsuit
      displayName: Pocket 1
      stripHidden: true
    - name: pocket2
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 1,4
      dependsOn: jumpsuit
      displayName: Pocket 2
      stripHidden: true
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,0
      strippingWindowPos: 2,5
      dependsOn: outerClothing
      displayName: Suit Storage
    # Aurora's Song Start - Moved entire thing up here, because the SecondHotbar draws in slot order, apparently.
    - name: wallet
      slotTexture: wallet
      slotFlags: WALLET
      slotGroup: SecondHotbar # Aurora's Song - Moved to make room for legs slot.
      stripTime: 6
      uiWindowPos: 2,0
      strippingWindowPos: 2,3
      dependsOn: jumpsuit
      displayName: Wallet
    # Aurora's Song End
    - name: id
      slotTexture: id
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      dependsOn: jumpsuit
      displayName: ID
    - name: belt
      slotTexture: belt
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,1
      strippingWindowPos: 1,5
      displayName: Belt
    - name: back
      slotTexture: back
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,0
      strippingWindowPos: 0,5
      displayName: Back
    # Aurora's Song Start - Legs Slot
    - name: legs
      slotTexture: legs
      slotFlags: LEGS
      stripTime: 6
      uiWindowPos: 2,0
      strippingWindowPos: 0,3
      displayName: Legs
    # Aurora's Song End
