#human but no shoes. basically the diona one for now
- type: inventoryTemplate
  id: decapoid
  slots:
  - name: jumpsuit
    slotTexture: uniform
    slotFlags: INNERCLOTHING
    stripTime: 6
    uiWindowPos: 0,1
    strippingWindowPos: 0,2
    displayName: Jumpsuit
  - name: outerClothing
    slotTexture: suit
    slotFlags: OUTERCLOTHING
    stripTime: 6
    uiWindowPos: 1,1
    strippingWindowPos: 1,2
    displayName: Suit
  - name: gloves
    slotTexture: gloves
    slotFlags: GLOVES
    uiWindowPos: 2,1
    strippingWindowPos: 2,2
    displayName: Gloves
  - name: neck
    slotTexture: neck
    slotFlags: NECK
    uiWindowPos: 0,2
    strippingWindowPos: 0,1
    displayName: Neck
  - name: mask
    slotTexture: mask
    slotFlags: MASK
    uiWindowPos: 1,2
    strippingWindowPos: 1,1
    displayName: Mask
  # Aurora's Song Start - Second neck slot
  - name: neck2 # Aurora's Song - Second neck slot (slotflags edition)
    slotTexture: neck
    slotFlags: NECK2 # Aurora's Song - Second neck slot (slotflags edition)
    uiWindowPos: 2,2
    strippingWindowPos: 2,1
    displayName: Neck 2
  # Aurora's Song End
  - name: eyes
    slotTexture: glasses
    slotFlags: EYES
    stripTime: 3
    uiWindowPos: 0,3
    strippingWindowPos: 0,0
    displayName: Eyes
  - name: ears
    slotTexture: ears
    slotFlags: EARS
    stripTime: 3
    uiWindowPos: 2,3
    strippingWindowPos: 2,0
    displayName: Ears
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,3
    strippingWindowPos: 1,0
    displayName: Head
  - name: pocket1
    slotTexture: pocket
    fullTextureName: template_small
    slotFlags: POCKET
    slotGroup: MainHotbar
    stripTime: 3
    uiWindowPos: 0,3
    strippingWindowPos: 0,4
    dependsOn: jumpsuit
    displayName: Pocket 1
    stripHidden: true
  - name: pocket2
    slotTexture: pocket
    fullTextureName: template_small
    slotFlags: POCKET
    slotGroup: MainHotbar
    stripTime: 3
    uiWindowPos: 2,3
    strippingWindowPos: 1,4
    dependsOn: jumpsuit
    displayName: Pocket 2
    stripHidden: true
  - name: suitstorage
    slotTexture: suit_storage
    slotFlags:   SUITSTORAGE
    slotGroup: MainHotbar
    stripTime: 3
    uiWindowPos: 2,0
    strippingWindowPos: 2,5 #they dont need suit storage clothing to use this slot
    displayName: Suit Storage
  # Aurora's Song Start - Wallet slot // Moved entire thing up here, because the SecondHotbar draws in slot order, apparently.
  - name: wallet
    slotTexture: wallet
    slotFlags: WALLET
    slotGroup: SecondHotbar # Aurora's Song - Moved to make room for legs slot.
    stripTime: 6
    uiWindowPos: 2,0
    strippingWindowPos: 2,3
    dependsOn: jumpsuit
    displayName: Wallet
  # Aurora's Song End
  - name: id
    slotTexture: id
    fullTextureName: template_small
    slotFlags: IDCARD
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 2,1
    strippingWindowPos: 2,4
    dependsOn: jumpsuit
    displayName: ID
  - name: belt
    slotTexture: belt
    fullTextureName: template_small
    slotFlags: BELT
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,1
    strippingWindowPos: 1,5
    displayName: Belt
  - name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,0
    strippingWindowPos: 0,5
    displayName: Back
    blacklist:
      tags:
      - PetOnly
  # Aurora's Song Start - Legs Slot
  - name: legs
    slotTexture: legs
    slotFlags: LEGS
    stripTime: 6
    uiWindowPos: 2,0
    strippingWindowPos: 0,3
    displayName: Legs
  # Aurora's Song End
